<!-- Lógica Completa de la Aplicación con Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =========================================================================
        // 1. CONFIGURACIÓN DE FIREBASE Y ESTADO INICIAL (2026)
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyC_vZXquA24kJ410JMBCmp5jPKkE4heM5I",
            authDomain: "tenis-rotativo.firebaseapp.com",
            projectId: "tenis-rotativo",
            storageBucket: "tenis-rotativo.firebasestorage.app",
            messagingSenderId: "1029197173515",
            appId: "1:1029197173515:web:5bdbb728fb4c181b2d080e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tenis-rotativo-2026';

        // Ruta pública compartida para que todos los jugadores lean y editen la misma liga
        const leagueDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'liga_tenis', 'temporada_2026');

        const DEFAULT_DATES = [
            'Dom 15-Nov', 'Sáb 21-Nov', 'Dom 22-Nov', 'Sáb 28-Nov', 'Dom 29-Nov',
            'Sáb 05-Dic', 'Dom 06-Dic', 'Sáb 12-Dic', 'Dom 13-Dic', 'Sáb 19-Dic',
            'Dom 20-Dic', 'Sáb 26-Dic', 'Dom 27-Dic'
        ];

        function getInitialState() {
            const createWinsRow = (firstDay) => [firstDay, ...Array(DEFAULT_DATES.length - 1).fill(0)];
            const createLossesRow = (firstDay) => [firstDay, ...Array(DEFAULT_DATES.length - 1).fill(0)];

            return {
                ptsWin: 2,
                ptsLoss: 1,
                dates: [...DEFAULT_DATES],
                players: [
                    { id: 'p1', name: 'Rodrigo', wins: createWinsRow(3), losses: createLossesRow(3) },
                    { id: 'p2', name: 'Gera', wins: createWinsRow(3), losses: createLossesRow(3) },
                    { id: 'p3', name: 'Alexis', wins: createWinsRow(4), losses: createLossesRow(2) }
                ],
                quickLogs: []
            };
        }

        let state = getInitialState();
        let currentUser = null;
        let unsubscribeSnapshot = null;
        let chartInstance = null;
        let chartMetric = 'wins';

        function updateSyncBadge(status, text) {
            const badge = document.getElementById('sync-status-badge');
            const footer = document.getElementById('footer-sync-status');
            if (!badge) return;

            if (status === 'online') {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-court-700 text-white';
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-tennis-neon animate-pulse"></span> ${escapeHtml(text)}`;
                if (footer) footer.innerHTML = `<i class="fa-solid fa-cloud-check"></i> ${escapeHtml(text)}`;
            } else if (status === 'saving') {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-sky-700 text-white';
                badge.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[10px]"></i> Guardando en nube...`;
            } else {
                badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-rose-700 text-white';
                badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${escapeHtml(text)}`;
            }
        }

        function subscribeToLeagueData() {
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(leagueDocRef, async (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data && Array.isArray(data.players) && Array.isArray(data.dates)) {
                        state = {
                            ptsWin: Number(data.ptsWin ?? 2),
                            ptsLoss: Number(data.ptsLoss ?? 1),
                            dates: data.dates,
                            players: data.players,
                            quickLogs: Array.isArray(data.quickLogs) ? data.quickLogs : []
                        };
                        renderAll();
                        updateSyncBadge('online', 'Sincronizado en tiempo real');
                    }
                } else {
                    // Documento no existe aún: lo creamos con el estado inicial
                    await saveState();
                    renderAll();
                }
            }, (error) => {
                console.error('Error en suscripción Firestore:', error);
                updateSyncBadge('error', `Error Firestore: ${error.code || 'permisos'}`);
                showToast(`Error de lectura (${error.code}): Revisa las reglas de Firestore.`, 'warning');
            });
        }

        async function initFirebaseSync() {
            // Advertencia si se abre como archivo local (file://)
            if (window.location.protocol === 'file:') {
                updateSyncBadge('error', 'Error: Abre usando servidor local (HTTP)');
                showToast('Firebase Auth no funciona abriendo el HTML directamente (file://). Usa Live Server o hosting.', 'warning');
                return;
            }

            // Escuchar el estado de autenticación antes de tocar Firestore
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    subscribeToLeagueData();
                }
            });

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error('Error inicializando autenticación:', err);
                const msg = err.code === 'auth/operation-not-allowed' 
                    ? 'Habilita Auth Anónima en Firebase' 
                    : `Error Auth: ${err.code || err.message}`;
                updateSyncBadge('error', msg);
                showToast(`Fallo de conexión (${err.code}). Verifica Firebase Console.`, 'warning');
            }
        }

        async function saveState() {
            if (!currentUser) {
                showToast('No hay sesión activa para guardar cambios.', 'warning');
                return;
            }
            try {
                updateSyncBadge('saving', 'Guardando...');
                await setDoc(leagueDocRef, {
                    ptsWin: state.ptsWin,
                    ptsLoss: state.ptsLoss,
                    dates: state.dates,
                    players: state.players,
                    quickLogs: state.quickLogs,
                    updatedAt: new Date().toISOString()
                });
                updateSyncBadge('online', 'Sincronizado en tiempo real');
            } catch (e) {
                console.error('Error guardando en Firestore:', e);
                updateSyncBadge('error', `Error al guardar: ${e.code || 'red'}`);
                showToast(`Error al guardar (${e.code}): Revisa reglas de escritura.`, 'warning');
            }
        }
